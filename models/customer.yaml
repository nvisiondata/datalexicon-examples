entity: Customer
description: Customer master data
attributes:
  - name: CustomerId
    type: identifier
    required: true
    primary_key: true
    description: unique identifier for a customer
  - name: CustomerName
    type: text
    length: 200
    required: true
  - name: EmailAddress
    type: text
    length: 254
  - name: CountryCode
    type: text
    length: 2
    required: true
  - name: CreatedAt
    type: datetime
    required: true

relationships:
  - entity: SalesOrder
    type: one-to-many
    source_attribute: CustomerId
    target_attribute: CustomerId
  - entity: Country
    type: many-to-one
    source_attribute: CountryCode
    target_attribute: CountryCode