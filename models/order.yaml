entity: Order
description: Sales order header
attributes:
  - name: OrderId
    type: identifier
    required: true
    primary_key: true
    description: unique identifier for an order
  - name: OrderDate
    type: datetime
    required: true
  - name: CustomerId
    type: identifier
    required: true
  - name: CountryCode
    type: text
    length: 10
    required: true

relationships:
  - entity: Customer
    type: many-to-one
    source_attribute: CustomerId
    target_attribute: CustomerId
  - entity: Country
    type: many-to-one
    source_attribute: CountryCode
    target_attribute: CountryCode