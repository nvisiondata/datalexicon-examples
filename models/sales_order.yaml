entity: SalesOrder
description: Sales order header
attributes:
  - name: SalesOrderId
    type: identifier
    required: true
    primary_key: true
    description: unique identifier for a sales order
  - name: OrderDate
    type: datetime
    required: true
  - name: CustomerId
    type: identifier
    required: true
  - name: OrderStatus
    type: text
    length: 20
    required: true
  - name: ShippingCountryCode
    type: text
    length: 2
    required: true

relationships:
  - entity: Customer
    type: many-to-one
    source_attribute: CustomerId
    target_attribute: CustomerId
  - entity: Country
    type: many-to-one
    source_attribute: ShippingCountryCode
    target_attribute: CountryCode
  - entity: SalesOrderLine
    type: one-to-many
    source_attribute: SalesOrderId
    target_attribute: SalesOrderId